recipe_version: "1"
name: Qwen3.8-27B-NVFP4-Solo-DSpark-Experimental
description: Experimental vLLM adapter for RadixArk Qwen3.8 27B NVFP4 with the RadixArk DSpark v2 draft
model: RadixArk/Qwen3.8-27B-NVFP4
solo_only: true
container: vllm-node
build_args: [--rebuild-vllm, --vllm-ref, main]
mods:
  - mods/radixark-dspark
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.75
  max_model_len: 262144
  max_num_batched_tokens: 32768
  max_num_seqs: 4
  num_speculative_tokens: 7
env:
  TRITON_CACHE_DIR: /workspace/.triton_cache
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  VLLM_USE_FLASHINFER_SAMPLER: "0"
command: |
  vllm serve RadixArk/Qwen3.8-27B-NVFP4 \
    --host {host} --port {port} \
    --served-model-name qwen3.8-27b \
    --trust-remote-code \
    --tensor-parallel-size {tensor_parallel} \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --max-num-seqs {max_num_seqs} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --kv-cache-dtype fp8 \
    --attention-backend flashinfer \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --async-scheduling \
    --mm-encoder-tp-mode data \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_coder \
    --reasoning-parser qwen3 \
    --default-chat-template-kwargs '{{"preserve_thinking":true}}' \
    --override-generation-config '{{"temperature":1.0,"top_p":0.95,"top_k":20,"min_p":0.0,"presence_penalty":0.0,"repetition_penalty":1.0}}' \
    --speculative-config '{{"method":"dspark","model":"RadixArk/Qwen3.8-27B-DSpark","num_speculative_tokens":{num_speculative_tokens}}}'
