# Xiaomi MiMo-V2.6-Flash-RL on two DGX Sparks with its bundled DFlash drafter.
recipe_version: "1"
name: MiMo-V2.6-Flash-RL (2 Sparks)
description: Official MiMo checkpoint with vLLM TP2 and bundled DFlash7
model: XiaomiMiMo/MiMo-V2.6-Flash-RL
container: vllm-node
cluster_only: true
mods:
  - mods/mimo-v2.6-fp8-qkv
  - mods/mimo-v2.6-dflash-omni

defaults:
  revision: 5711b268169967567844e1e560e8a3966da959b1
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  max_model_len: 131072
  max_num_seqs: 4
  gpu_memory_utilization: 0.85

env:
  CUTE_DSL_ARCH: "sm_121a"
  VLLM_USE_DEEP_GEMM: "0"
  VLLM_WORKER_MULTIPROC_METHOD: "spawn"

command: |
  vllm serve XiaomiMiMo/MiMo-V2.6-Flash-RL \
    --revision {revision} \
    --host {host} \
    --port {port} \
    --trust-remote-code \
    --tensor-parallel-size {tensor_parallel} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --kv-cache-dtype auto \
    --moe-backend marlin \
    --generation-config vllm \
    --no-async-scheduling \
    --speculative-config '{{"method":"dflash","model":"/root/.cache/huggingface/hub/models--XiaomiMiMo--MiMo-V2.6-Flash-RL/snapshots/{revision}/dflash","num_speculative_tokens":7}}' \
    --reasoning-parser mimo \
    --tool-call-parser mimo \
    --enable-auto-tool-choice
