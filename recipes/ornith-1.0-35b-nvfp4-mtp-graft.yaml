# Spark Arena single-Spark profile: 116.82 decode tok/s at tg128 (c1).

recipe_version: "1"
name: Ornith-1.0-35B-NVFP4-MTP-Graft-Arena-Solo
description: Spark Arena single-Spark Ornith NVFP4 checkpoint with a three-token MTP graft
model: pocharlies/Ornith-1.0-35B-NVFP4-MTP-graft
solo_only: true
container: vllm-node
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.55
  max_model_len: 262144
  max_num_batched_tokens: 32768
  max_num_seqs: 4
  num_speculative_tokens: 3
env:
  PROMETHEUS_METRICS_ENABLED: "false"
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
  VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "1"
  VLLM_USE_FLASHINFER_SAMPLER: "1"
  CUBLASLT_WORKSPACE_SIZE: "33554432"
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:False
  RUNAI_STREAMER_MEMORY_LIMIT: "4294967296"
  CUTE_DSL_ARCH: sm_121a
  TORCH_CUDA_ARCH_LIST: "12.1"
  CUTLASS_SMEM_CARVEOUT_KB: "99"
  FLASHINFER_DISABLE_VERSION_CHECK: "1"
command: |
  vllm serve pocharlies/Ornith-1.0-35B-NVFP4-MTP-graft \
    --served-model-name ornith-1.0-35b-nvfp4-mtp \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --trust-remote-code \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --load-format fastsafetensors \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --max-num-seqs {max_num_seqs} \
    --kv-cache-dtype fp8 \
    --performance-mode throughput \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --enable-auto-tool-choice \
    --reasoning-parser qwen3 \
    --tool-call-parser qwen3_coder \
    --attention-backend flashinfer \
    --speculative-config '{{"method":"mtp","num_speculative_tokens":{num_speculative_tokens}}}' \
    --generation-config auto \
    --override-generation-config '{{"temperature":0.7,"top_p":0.8,"top_k":20}}'
